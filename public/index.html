
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Responsive Design -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Website Branding -->
    <meta name="theme-color" content="#00243d" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>
      Soni Driver Centre 
    </title>

    <meta
      name="description"
      content="Welcome to Soni Driver Centre. Explore our professional driving services, experienced drivers, and reliable driver solutions. Contact us to learn more."
    />

    <meta
      name="keywords"
      content="Soni Driver Centre, Soni Driver Centre official website, professional drivers, driving services, driver services"
    />

    <meta name="author" content="Soni Driver Centre" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://sonidrivercentre.com/"
    />

    <!-- Website Logo / Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo.png"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Soni Driver Centre | Professional Driving Services"
    />

    <meta
      property="og:description"
      content="Discover professional driving services and reliable driver solutions at Soni Driver Centre."
    />

    <meta
      property="og:url"
      content="https://sonidrivercentre.com/"
    />

    <meta
      property="og:site_name"
      content="Soni Driver Centre"
    />

    <meta
      property="og:image"
      content="https://sonidrivercentre.com/logo.png"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Soni Driver Centre | Professional Driving Services"
    />

    <meta
      name="twitter:description"
      content="Explore professional driving services at Soni Driver Centre."
    />

    <meta
      name="twitter:image"
      content="https://sonidrivercentre.com/logo.png"
    />

    <!-- PWA Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Browser Title -->
    <title>Soni Driver Centre</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this website.
    </noscript>

    <div id="root"></div>
  </body>
</html>
